name: Build macOS (Apple Silicon)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest   # Apple Silicon Runner

    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps/juce-src
          key: juce-src-8.0.4-${{ github.event.repository.name }}-${{ runner.os }}-${{ runner.arch }}

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --target OneShooter_VST3 OneShooter_Standalone -j 4

      - name: Sign (ad-hoc) and package
        run: |
          ART=build/OneShooter_artefacts/Release
          codesign --force --deep --sign - "$ART/VST3/One Shooter.vst3"
          codesign --force --deep --sign - "$ART/Standalone/One Shooter.app"
          mkdir -p dist "pkg/One Shooter"
          cp -R "$ART/VST3/One Shooter.vst3" "pkg/One Shooter/"
          cp INSTALL.txt "pkg/One Shooter/INSTALL.txt"
          ditto -c -k --keepParent "pkg/One Shooter" "dist/OneShooter-VST3-macOS-arm64.zip"
          ditto -c -k --keepParent "$ART/Standalone/One Shooter.app" "dist/OneShooter-Standalone-macOS-arm64.zip"

      - name: Build installer (.pkg)
        run: |
          ART=build/OneShooter_artefacts/Release
          VERSION=$(grep -m1 -oE 'project\(OneShooter VERSION [0-9.]+' CMakeLists.txt | grep -oE '[0-9.]+$')
          mkdir -p pkgroot build/pkg
          cp -R "$ART/VST3/One Shooter.vst3" pkgroot/
          # Bundle nicht umleiten (sonst installiert macOS ggf. an einen alten Ort)
          pkgbuild --analyze --root pkgroot build/pkg/component.plist
          plutil -replace 0.BundleIsRelocatable -bool NO build/pkg/component.plist
          pkgbuild --root pkgroot --component-plist build/pkg/component.plist \
            --identifier ch.danikoenig.oneshooter.vst3 --version "$VERSION" \
            --install-location "/Library/Audio/Plug-Ins/VST3" build/pkg/OneShooterVST3.pkg
          sed "s/@VERSION@/$VERSION/" installer/distribution.xml > build/pkg/distribution.xml
          productbuild --distribution build/pkg/distribution.xml --resources installer/resources \
            --package-path build/pkg "dist/One Shooter Installer.pkg"
          pkgutil --payload-files "dist/One Shooter Installer.pkg" | head -5

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneShooter-macOS-arm64
          path: |
            dist/*.zip
            dist/*.pkg

      - name: Release (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.pkg
